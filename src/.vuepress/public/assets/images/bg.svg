<svg
  version="1.1"
  baseProfile="full"
  width="100%" height="100%"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1400 800"
>

  <!-- 右下角C  -->
  <path d="M 1400 400 a 200 140 0 0 0 0 300" stroke="#ca414b" fill="none" stroke-width="100">
    <animateTransform xmlns="http://www.w3.org/2000/svg" attributeType="XML" attributeName="transform" begin="0s" dur="35s" type="rotate" from="0 1450 550" to="360 1450 550" repeatCount="indefinite"/>
  </path>

  <!-- 右上角M  -->
  <path d="M 100 380 L 160 250 L 220 350 L 280 250 L 340 380" stroke="#8a5096" fill="none"  stroke-width="40">
    <!-- 保留原有动画 -->
    <animateMotion path="M 800 -200 L 800 -250 L 800 -200" dur="20s" begin="0s" repeatCount="indefinite" />
    <animateTransform attributeType="XML" attributeName="transform" begin="0s" dur="30s" type="rotate" values="0 300 300 ; 4 300 300 ; 0 300 300" keyTimes="0 ; 0.5 ; 1" repeatCount="indefinite" />
  </path>

  <!-- 右下小圆  -->
  <circle cx="1000" cy="600" r="30" stroke="rgb(241, 243, 244)" fill="rgb(241, 243, 244)">
    <animateMotion path="M 0 0 L -20 40 Z" dur="9s" repeatCount="indefinite" />
  </circle>

  <!-- 左上Y  -->
  <path d="M 225 165 L 225 188 M 205 155 L 225 165 L 245 155"
        stroke="#6958bc" stroke-width="12" fill="none">
    <animateMotion path="M 0 0 L 40 20 Z" dur="5s" repeatCount="indefinite" />
  </path>

  <!-- 左上侧的圆形 -->
  <circle cx="420" cy="80"  r="20" stroke="rgb(241, 243, 244)" fill="rgb(241, 243, 244)">
    <animateMotion path="M 0 0 L -20 40 Z" dur="9s" repeatCount="indefinite" />
  </circle>

  <!-- 左中三角形 -->
  <path d="M 165 580 L 270 580 Q275 578 270 570 L 223 483 Q220 480 217 483 L 165 570 Q160 578 165 580" stroke="rgb(238, 103, 92)" fill="rgb(238, 103, 92)">
    <animateTransform attributeType="XML" attributeName="transform" begin="0s" dur="35s" type="rotate" from="0 210 530" to="360 210 530" repeatCount="indefinite" />
  </path>

  <!-- 左下灰长圆状  -->
  <path d="M 100 350 A 40 40 0 1 1 180 350 L 180 430 A 40 40 0 1 1 100 430 Z" stroke="rgb(241, 243, 244)" fill="rgb(241, 243, 244)">
    <animateMotion path="M 140 390 L 180 360 L 140 390" dur="20s" begin="0s" repeatCount="indefinite" />
    <animateTransform attributeType="XML" attributeName="transform" begin="0s" dur="30s" type="rotate" values="0 140 390; -60 140 390; 0 140 390" keyTimes="0 ; 0.5 ; 1" repeatCount="indefinite" />
  </path>

  <!-- 左下圆   -->
  <rect x="400" y="600" rx="40" ry="40" width="100" height="100" stroke="rgb(129, 201, 149)" fill="rgb(129, 201, 149)">
    <animateTransform attributeType="XML" attributeName="transform" begin="0s" dur="35s" type="rotate" from="-30 550 750" to="300 550 750" repeatCount="indefinite" />
  </rect>
</svg>
